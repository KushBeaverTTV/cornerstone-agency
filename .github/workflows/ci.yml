name: CI

on:
  push:
    branches: [main, "design/**", "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: App · unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

  bridge:
    name: Bridge · pytest
    # The bridge drives Windows tooling (prime-agent, PowerShell launchers); test where it runs.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: pytest
        run: uv run --extra test pytest tests -q -p no:warnings
