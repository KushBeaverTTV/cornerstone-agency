[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-bridge"
version = "0.2.0"
description = "Cornerstone Agency desktop bridge — Prima (prime-agent RPC) + Laya routing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
    "psutil==7.2.2",
    "numpy>=2.0",
    "safetensors>=0.4",
    "transformers>=4.48",
    "torch>=2.4",
    "httpx>=0.27",
    "websockets>=13",
    "qrcode>=7.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
agency-bridge = "agency_bridge.app:run"

[tool.setuptools.packages.find]
include = ["agency_bridge", "agency_bridge.*"]

# CPU-only torch on Windows — the CUDA wheel is ~2.5 GB and Laya runs fine on CPU.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
